AWSTemplateFormatVersion: '2010-09-09'
Description: 'NovaMart AgentCore foundation: DynamoDB, policy documents, S3 Vectors,
  execution roles and encrypted logs.'
Parameters:
  ProjectName:
    Type: String
    Default: udacity-agentcore
    AllowedPattern: '[a-z][a-z0-9-]{2,25}'
Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${ProjectName}-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: customer_id
        AttributeType: S
      - AttributeName: order_id
        AttributeType: S
      KeySchema:
      - AttributeName: customer_id
        KeyType: HASH
      - AttributeName: order_id
        KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  CustomersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${ProjectName}-customers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: customer_id
        AttributeType: S
      KeySchema:
      - AttributeName: customer_id
        KeyType: HASH
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  WorkflowStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${ProjectName}-workflow-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: session_id
        AttributeType: S
      KeySchema:
      - AttributeName: session_id
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  PolicyDocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub:
        - ${ProjectName}-policy-docs-${AWS::AccountId}-${ShortUUID}
        - ShortUUID:
            Fn::Select:
            - 0
            - Fn::Split:
              - '-'
              - Fn::Select:
                - 2
                - Fn::Split:
                  - /
                  - Ref: AWS::StackId
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  VectorStoreBucket:
    Type: AWS::S3Vectors::VectorBucket
    Properties:
      VectorBucketName:
        Fn::Sub:
        - ${ProjectName}-vectors-${AWS::AccountId}-${ShortUUID}
        - ShortUUID:
            Fn::Select:
            - 0
            - Fn::Split:
              - '-'
              - Fn::Select:
                - 2
                - Fn::Split:
                  - /
                  - Ref: AWS::StackId
      EncryptionConfiguration:
        SseType: AES256
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  AgentCoreExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ProjectName}-agentcore-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: bedrock-agentcore.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*
      Policies:
      - PolicyName: AgentCoreProjectPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
            - bedrock:ApplyGuardrail
            Resource: '*'
          - Effect: Allow
            Action:
            - bedrock:Retrieve
            Resource: '*'
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:CreateLogDelivery
            - logs:PutLogEvents
            - logs:DescribeLogGroups
            - logs:DescribeLogStreams
            Resource: '*'
          - Effect: Allow
            Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
            Resource: '*'
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:Scan
            Resource:
            - Fn::GetAtt:
              - OrdersTable
              - Arn
            - Fn::GetAtt:
              - CustomersTable
              - Arn
            - Fn::GetAtt:
              - WorkflowStateTable
              - Arn
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:ListBucket
            Resource:
            - Fn::GetAtt:
              - PolicyDocumentsBucket
              - Arn
            - Fn::Sub: ${PolicyDocumentsBucket.Arn}/*
          - Effect: Allow
            Action:
            - s3vectors:GetIndex
            - s3vectors:GetVectors
            - s3vectors:QueryVectors
            Resource:
            - Ref: ReturnsPolicyIndex
            - Ref: ShippingPolicyIndex
            - Ref: WarrantyPolicyIndex
          - Effect: Allow
            Action:
            - cloudformation:ListExports
            Resource: '*'
          - Effect: Allow
            Action:
            - bedrock-agentcore:CreateEvent
            - bedrock-agentcore:ListEvents
            - bedrock-agentcore:RetrieveMemoryRecords
            Resource:
              Fn::Sub: arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:memory/*
  AgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/bedrock/agentcore/${ProjectName}
      RetentionInDays: 14
      KmsKeyId:
        Fn::GetAtt:
        - LogEncryptionKey
        - Arn
  ReturnsPolicyIndex:
    Type: AWS::S3Vectors::Index
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VectorBucketArn:
        Ref: VectorStoreBucket
      IndexName: returns-policy-index
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine
      MetadataConfiguration:
        NonFilterableMetadataKeys:
        - AMAZON_BEDROCK_TEXT
        - AMAZON_BEDROCK_METADATA
  ShippingPolicyIndex:
    Type: AWS::S3Vectors::Index
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VectorBucketArn:
        Ref: VectorStoreBucket
      IndexName: shipping-policy-index
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine
      MetadataConfiguration:
        NonFilterableMetadataKeys:
        - AMAZON_BEDROCK_TEXT
        - AMAZON_BEDROCK_METADATA
  WarrantyPolicyIndex:
    Type: AWS::S3Vectors::Index
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VectorBucketArn:
        Ref: VectorStoreBucket
      IndexName: warranty-policy-index
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine
      MetadataConfiguration:
        NonFilterableMetadataKeys:
        - AMAZON_BEDROCK_TEXT
        - AMAZON_BEDROCK_METADATA
  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ProjectName}-kb-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: bedrock.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
      Policies:
      - PolicyName: PolicyRetrieval
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - bedrock:InvokeModel
            Resource:
              Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
          - Effect: Allow
            Action:
            - s3:ListBucket
            Resource:
              Fn::GetAtt:
              - PolicyDocumentsBucket
              - Arn
            Condition:
              StringLike:
                s3:prefix:
                - policies/*
          - Effect: Allow
            Action:
            - s3:GetObject
            Resource:
              Fn::Sub: ${PolicyDocumentsBucket.Arn}/policies/*
          - Effect: Allow
            Action:
            - s3vectors:GetIndex
            - s3vectors:PutVectors
            - s3vectors:GetVectors
            - s3vectors:DeleteVectors
            - s3vectors:QueryVectors
            Resource:
            - Ref: ReturnsPolicyIndex
            - Ref: ShippingPolicyIndex
            - Ref: WarrantyPolicyIndex
  LogEncryptionKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
        - Sid: AccountAdministration
          Effect: Allow
          Principal:
            AWS:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
          Action: kms:*
          Resource: '*'
        - Sid: CloudWatchEncryption
          Effect: Allow
          Principal:
            Service:
              Fn::Sub: logs.${AWS::Region}.amazonaws.com
          Action:
          - kms:Encrypt
          - kms:Decrypt
          - kms:ReEncrypt*
          - kms:GenerateDataKey*
          - kms:DescribeKey
          Resource: '*'
          Condition:
            ArnLike:
              kms:EncryptionContext:aws:logs:arn:
              - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock/agentcore/${ProjectName}
              - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/udacity_agentcore_runtime*
Outputs:
  OrdersTableName:
    Value:
      Ref: OrdersTable
    Export:
      Name:
        Fn::Sub: ${ProjectName}-OrdersTable
  CustomersTableName:
    Value:
      Ref: CustomersTable
    Export:
      Name:
        Fn::Sub: ${ProjectName}-CustomersTable
  WorkflowStateTableName:
    Value:
      Ref: WorkflowStateTable
    Export:
      Name:
        Fn::Sub: ${ProjectName}-WorkflowStateTable
  PolicyDocumentsBucketName:
    Value:
      Ref: PolicyDocumentsBucket
    Export:
      Name:
        Fn::Sub: ${ProjectName}-PolicyBucket
  VectorStoreBucketName:
    Value:
      Fn::Sub:
      - ${ProjectName}-vectors-${AWS::AccountId}-${ShortUUID}
      - ShortUUID:
          Fn::Select:
          - 0
          - Fn::Split:
            - '-'
            - Fn::Select:
              - 2
              - Fn::Split:
                - /
                - Ref: AWS::StackId
    Export:
      Name:
        Fn::Sub: ${ProjectName}-VectorBucket
  AgentCoreRoleArn:
    Value:
      Fn::GetAtt:
      - AgentCoreExecutionRole
      - Arn
    Export:
      Name:
        Fn::Sub: ${ProjectName}-AgentCoreRoleArn
  AgentLogGroupName:
    Value:
      Ref: AgentLogGroup
    Export:
      Name:
        Fn::Sub: ${ProjectName}-AgentLogGroup
  KnowledgeBaseRoleArn:
    Value:
      Fn::GetAtt:
      - KnowledgeBaseRole
      - Arn
    Export:
      Name:
        Fn::Sub: ${ProjectName}-KnowledgeBaseRoleArn
  LogEncryptionKeyArn:
    Value:
      Fn::GetAtt:
      - LogEncryptionKey
      - Arn
    Export:
      Name:
        Fn::Sub: ${ProjectName}-LogEncryptionKeyArn
