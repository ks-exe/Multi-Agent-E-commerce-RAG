name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline behavioral tests
        run: python tests/test_workflow.py
      - name: Verify trace continuity and failures
        run: python -m unittest discover -s tests -p test_telemetry.py -v
      - name: Verify submitted evidence
        run: python tools/verify_submission.py
      - name: Verify evidence viewer is reproducible
        run: |
          python tools/build_portfolio.py
          git diff --exit-code -- docs/index.html
